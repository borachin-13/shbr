name: syntax-check-temp
on:
  push:
    branches:
      - qa/syntax-check-20261004
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse module script
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const start = html.indexOf('<script type="module">');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('module script not found');
          let s = html.slice(start + '<script type="module">'.length, end);
          fs.writeFileSync('/tmp/app.mjs', s);
          NODE
          node --check /tmp/app.mjs
